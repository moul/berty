name: Release
on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - "go/**"
      - "!go/**.md"
      - ".goreleaser"
      - "go.*"
      - "**.go"
      - ".github/workflows/release.yml"

# this workflow consists of
# * 1 build-asset job instance per target architecture/os, run even if the flow is not running against a release
# * then, a semantic-release job if the workflow runs against a real release
jobs:
  build-asset:
    name: build asset
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        - {runs-on: 'ubuntu-latest',  goos: 'linux',   goarch: 'amd64', golang: '1.17.x'}
        - {runs-on: 'ubuntu-latest',  goos: 'linux',   goarch: 'arm64', golang: '1.17.x'}
        - {runs-on: 'darwin-latest',  goos: 'darwin',  goarch: 'amd64', golang: '1.17.x'}
        - {runs-on: 'windows-latest', goos: 'windows', goarch: 'amd64', golang: '1.17.x'}
        # TODO: bertyguy
    env:
      OSXCROSS_DIR: /home/runner/work/osxcross
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Load variables from file
        uses: antifree/json-to-variables@v1.0.1
        with:
          filename: .github/workflows/utils/variables.json
      - name: Install goreleaser dependencies
        run: |
          # install osxcross
          # install multilib
          # install bertygui graphical libraries
          # downgrade libssl for osxcross
          echo 'deb http://security.ubuntu.com/ubuntu bionic-security main' | sudo tee -a /etc/apt/sources.list
          sudo apt update
          sudo apt-cache policy libssl1.0-dev
          sudo apt install -f libssl1.0-dev
          sudo apt install -f gcc-multilib g++-multilib gcc-mingw-w64 clang
          sudo apt install -f -y libgl1-mesa-glx libgl1-mesa-dev xorg-dev
          mkdir ../../osxcross
          git clone https://github.com/plentico/osxcross-target.git ../../osxcross/target
      - name: Downgrade libssl for osxcross
        run: |
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: ${{ matrix.golang }}
      - name: Cache Go modules
        uses: actions/cache@v2.1.6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.golang }}-${{ env.json_cache-version_go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-${{ matrix.golang }}-${{ env.json_cache-version_go }}-
      - name: Build binary
        run: |
          CGO_ENABLED=1 GOOS=${{matrix.goos}} GOARCH=${{matrix.goarch}} go build -a ./go/cmd/berty

      # TODO: try to use goreleaser configuration and only call the command with a specific build

      # TODO: upload artifact

      #- name: Run GoReleaser
      #  if: steps.semantic.outputs.new-release-published == 'true'
      #  uses: goreleaser/goreleaser-action@v2.9.1
      #  with:
      #    version: latest
      #    args: release --rm-dist
      #  env:
      #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #- name: Run GoReleaser (dry-run)
      #  if: steps.semantic.outputs.new-release-published != 'true'
      #  uses: goreleaser/goreleaser-action@v2.9.1
      #  with:
      #    version: latest
      #    args: release --rm-dist --skip-publish
      #  env:
      #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: [ build-asset ]
    name: semantic release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Unshallow
        run: git fetch --prune --unshallow
      - name: Run Semantic Release
        id: semantic
        uses: docker://ghcr.io/codfish/semantic-release-action:v1
        with:
          branches: |
            ['master']
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Next step also sets up a .npmrc file for automatic publishing to npm
      - uses: actions/setup-node@v2
        if: steps.semantic.outputs.new-release-published == 'true'
        with:
          node-version: "14.x"
          registry-url: "https://registry.npmjs.org"
      - name: "Publish npm package: @berty/api"
        if: steps.semantic.outputs.new-release-published == 'true'
        run: go run ./go/cmd/publish-npm-package -path=js/packages/api -version=${{ steps.semantic.outputs.release-version }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Register version on pkg.go.dev
        if: steps.semantic.outputs.new-release-published == 'true'
        run: |
          package=$(cat go.mod | grep ^module | awk '{print $2}')
          version=v${{ steps.semantic.outputs.release-version }}
          url=https://proxy.golang.org/${package}/@v/${version}.info
          set -x +e
          curl -i $url
